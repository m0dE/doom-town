<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Doom Town — renderer viewer</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #hud { position: fixed; left: 8px; top: 6px; font: 12px/1.35 ui-monospace, Menlo, monospace; color: #cfc; text-shadow: 0 1px 2px #000; white-space: pre; pointer-events: none; }
  #help { position: fixed; right: 8px; top: 6px; font: 12px/1.35 ui-monospace, Menlo, monospace; color: #aaa; text-align: right; white-space: pre; pointer-events: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">loading…</div>
<div id="help">click: mouse look   WASD: fly   Space/C: up/down   Shift: fast
LMB: fire rocket   1-4: weapon   B: bloom   L: lights   O: AO   P: players</div>
<script type="module" src="/src/viewer.ts"></script>
</body>
</html>
