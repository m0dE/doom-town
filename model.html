<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marine model - Freedoom Deathmatch</title>
<style>
  html, body { margin: 0; height: 100%; background: #141414; color: #ddd; font: 13px/1.4 ui-monospace, Menlo, Consolas, monospace; overflow: hidden; }
  #stage { position: fixed; inset: 0; }
  #stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #overlay { image-rendering: pixelated; pointer-events: none; }
  #ui { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 12px; display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center;
        background: linear-gradient(transparent, rgba(0,0,0,.85) 40%); }
  #ui .group { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
  #ui .label { color: #888; margin-right: 2px; }
  button { font: inherit; color: #ddd; background: #2a2a2a; border: 1px solid #444; padding: 3px 8px; cursor: pointer; }
  button:hover { background: #383838; }
  button.on { background: #8a2a1a; border-color: #c4553a; color: #fff; }
  button.swatch { width: 18px; height: 18px; padding: 0; }
  button.swatch.on { outline: 2px solid #fff; outline-offset: 1px; }
  #stats { position: fixed; bottom: 84px; right: 12px; color: #777; text-align: right; white-space: pre; }
  body.shot #ui, body.shot #stats { display: none; }
</style>
</head>
<body>
<div id="stage"><canvas id="gl"></canvas><canvas id="overlay"></canvas></div>
<div id="stats"></div>
<div id="ui"></div>
<script type="module" src="./src/model-demo.ts"></script>
</body>
</html>
